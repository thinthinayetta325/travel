<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <!-- Changed max-w-xl to max-w-md to make it slightly less wide, and fixed the missing closing quote -->
    <section
      class="bg-white flex flex-col items-center justify-center border rounded-2xl shadow-xl w-1/3 max-w-md mx-auto p-6 sm:p-8"
    >
      <!-- Icon Container -->
      <div
        class="flex items-center justify-center bg-slate-100 w-14 h-14 border shadow-sm rounded-2xl mb-4"
      >
        <img
          src="images/password.png"
          alt="Login"
          class="w-7 h-7 object-contain"
        />
      </div>

      <!-- Header Typography -->
      <div class="text-center mb-6">
        <h1 class="font-bold text-2xl text-gray-900 tracking-tight mb-1">
          Welcome back
        </h1>
        <p class="text-sm text-gray-500">
          Enter your credentials to access your account
        </p>
      </div>

      <!-- Form with fixed class attribute wrapper -->
      <form class="flex flex-col gap-4 w-full">
        <!-- Email Input Group -->
        <div class="flex flex-col gap-1.5 w-full">
          <label for="address" class="font-semibold text-sm text-gray-700"
            >Email Address</label
          >
          <input
            id="address"
            type="email"
            name="address"
            placeholder="name@company.com"
            required
            class="bg-gray-50 border border-gray-300 rounded-lg shadow-sm p-2.5 text-sm focus:outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-100 transition-all"
          />
        </div>

        <!-- Password Input Group -->
        <div class="flex flex-col gap-1.5 w-full">
          <label for="password" class="font-semibold text-sm text-gray-700"
            >Password</label
          >
          <input
            id="password"
            type="password"
            name="password"
            placeholder="••••••••"
            minlength="8"
            required
            class="bg-gray-50 border border-gray-300 rounded-lg shadow-sm p-2.5 text-sm focus:outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-100 transition-all"
          />
        </div>

        <!-- Remember Me & Forgot Password Utilities -->
        <div class="flex items-center justify-between pt-1 text-sm">
          <div class="flex items-center gap-2">
            <input
              id="terms"
              type="checkbox"
              required
              class="h-4 w-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500"
            />
            <label for="terms" class="text-gray-600 select-none"
              >Remember me</label
            >
          </div>
          <a
            href="#"
            class="font-medium text-violet-600 hover:text-violet-700 transition-colors"
            >Forgot password?</a
          >
        </div>

        <!-- Action Button -->
        <div class="mt-2">
          <button
            type="submit"
            class="bg-violet-600 w-full text-white font-medium rounded-lg shadow-sm py-2.5 text-sm transition-colors hover:bg-violet-700 active:bg-violet-800"
          >
            Login &rarr;
          </button>
        </div>
      </form>

      <!-- Footer Navigation Link -->
      <div class="mt-6 border-t border-gray-100 w-full text-sm text-center">
        <p class="text-gray-600">
          Don't have an account?
          <a
            href="#"
            class="text-violet-600 font-semibold hover:text-violet-700 transition-colors"
            >Sign up here</a
          >
        </p>
      </div>
    </section>
  </body>
</html>
