<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="bg-white flex flex-col items-center justify-center border rounded-md shadow-md w-1/3 m-auto p-4 mt-4"
    >
      <div class="bg-gray-300 w-12 h-12 border shadow-sm rounded-md mt-4">
        <img src="images/profile.png" alt="Sign Up" class="w-12 h-12 p-2" />
      </div>

      <div class="text-center my-6">
        <h1 class="font-bold text-2xl">Create Account</h1>
        <p>Join us today!.It only takes a minute.</p>
      </div>
      <form class="flex flex-col gap-3">
        <div class="flex space-x-3">
          <div class="flex flex-col gap-2">
            <label for="name" id="name" class="font-bold">Full Name</label>
            <input
              type="text"
              name="name"
              placeholder="John Doe"
              class="bg-gray-100 border rounded-md shadow-md p-2"
            />
          </div>
          <div class="flex flex-col gap-3">
            <label for="address" id="address" class="font-bold"
              >Email Address
            </label>
            <input
              type="text"
              name="address"
              placeholder="name@company.com"
              class="bg-gray-100 border rounded-md shadow-md p-2"
            />
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <label for="password" id="password" class="font-bold">Password</label>
          <input
            type="password"
            name="password"
            placeholder="........"
            maxlength="8"
            class="bg-gray-100 border rounded-md shadow-md p-2"
          />
        </div>

        <div class="flex flex-col gap-3">
          <label for="password" id="password" class="font-bold"
            >Confirm Password</label
          >
          <input
            type="password"
            name="password"
            placeholder="........"
            maxlength="8"
            class="bg-gray-100 border rounded-md shadow-md p-2"
          />
        </div>

        <div class="flex gap-2">
          <input type="checkbox" />
          <p>
            I agree to the
            <a href="#" class="underline text-violet-600">Terms of Service</a
            >and<a href="#" class="underline text-violet-600">
              Privacy Policy</a
            >
          </p>
        </div>

        <div>
          <button
            type="submit"
            class="bg-violet-600 w-full text-white font-bold border rounded-md shadow-md px-10 py-2"
          >
            Create My Account >>
          </button>
        </div>
      </form>

      <div class="p-4">
        <p>
          Already have an account?<a href="#" class="text-violet-600 underline"
            >Sign in here</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
