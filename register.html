<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <!-- Responsive container: w-full on mobile, caps at max-w-xl on larger screens -->
    <div
      class="bg-white flex flex-col items-center justify-center border rounded-2xl shadow-xl max-w-xl mx-auto sm:p-6 md:p-8"
    >
      <div class="bg-gray-300 w-12 h-12 border shadow-sm rounded-2xl mt-4">
        <img src="images/profile.png" alt="Sign Up" class="w-12 h-12 p-2" />
      </div>

      <div class="text-center my-6">
        <h1 class="font-bold text-2xl">Create Account</h1>
        <p class="text-gray-600 text-sm mt-1">
          Join us today! It only takes a minute.
        </p>
      </div>

      <form class="flex flex-col gap-4 w-full">
        <!-- Name & Email layout: stacked on mobile, side-by-side on tablet/desktop -->
        <div class="flex flex-col md:flex-row gap-4">
          <div class="flex flex-col gap-2">
            <label for="name" class="font-bold text-sm text-gray-700"
              >Full Name</label
            >
            <input
              id="name"
              type="text"
              name="name"
              placeholder="John Doe"
              required
              class="bg-gray-100 border rounded-xl shadow-sm p-2 focus:outline-none focus:ring-2 focus:ring-violet-600"
            />
          </div>
          <div class="flex flex-col gap-2">
            <label for="address" class="font-bold text-sm text-gray-700"
              >Email Address</label
            >
            <input
              id="address"
              type="email"
              name="address"
              placeholder="name@company.com"
              required
              class="bg-gray-100 border rounded-xl shadow-md p-2 focus:outline-none focus:ring-2 focus:ring-violet-600"
            />
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label for="password" class="font-bold text-sm text-gray-700"
            >Password</label
          >
          <input
            id="password"
            type="password"
            name="password"
            placeholder="........"
            maxlength="8"
            required
            class="bg-gray-100 border rounded-xl shadow-sm p-2 focus:outline-none focus:ring-2 focus:ring-violet-600"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="confirm-password" class="font-bold text-sm text-gray-700"
            >Confirm Password</label
          >
          <input
            id="confirm-password"
            type="password"
            name="confirm_password"
            placeholder="........"
            maxlength="8"
            required
            class="bg-gray-100 border rounded-xl shadow-sm p-2 focus:outline-none focus:ring-2 focus:ring-violet-600"
          />
        </div>

        <div class="flex items-start gap-2 pt-2">
          <input
            id="terms"
            type="checkbox"
            required
            class="mt-1 h-4 w-4 text-violet-600 border-gray-300 rounded focus:ring-violet-500"
          />
          <label for="terms" class="text-sm text-gray-600">
            I agree to the
            <a href="#" class="underline text-violet-600 hover:text-violet-700"
              >Terms of Service</a
            >
            and
            <a href="#" class="underline text-violet-600 hover:text-violet-700"
              >Privacy Policy</a
            >
          </label>
        </div>

        <div class="mt-2">
          <button
            type="submit"
            class="bg-violet-600 w-full text-white font-bold border rounded-xl shadow-md py-2.5 transition-colors hover:bg-violet-700"
          >
            Create My Account &gt;&gt;
          </button>
        </div>
      </form>

      <div class="pt-6 text-sm text-center">
        <p class="text-gray-600">
          Already have an account?
          <a
            href="#"
            class="text-violet-600 underline font-medium hover:text-violet-700"
            >Sign in here</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
